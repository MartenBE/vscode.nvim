# To add this to your config, e.g. if using Lazy:
# import:
#   - ~/.local/share/nvim/lazy/vscode.nvim/extra/alacritty/alacritty.yml
schemes:
  codelight: &light
    primary:
      background: "#FFFFFF"
      foreground: "#3B3B3B"

    cursor:
      text: "#FFFFFF"
      cursor: "#000000"

    selection:
      text: CellForeground
      background: "#ADD6FF"

    normal:
      black: "#000000"
      red: "#CD3131"
      green: "#107C10"
      yellow: "#949800"
      blue: "#0451A5"
      magenta: "#BC05BC"
      cyan: "#0598BC"
      white: "#555555"

    bright:
      black: "#666666"
      red: "#F14C4C"
      green: "#14CE14"
      yellow: "#B5BA00"
      blue: "#3B8EEA"
      magenta: "#D670D6"
      cyan: "#29B8DB"
      white: "#A5A5A5"

  codedark: &dark
    primary:
      background: "#1F1F1F"
      foreground: "#CCCCCC"

    cursor:
      text: "#1F1F1F"
      cursor: "#AEAFAD"

    selection:
      text: CellForeground
      background: "#264F78"

    normal:
      black: "#000000"
      red: "#CD3131"
      green: "#0DBC79"
      yellow: "#E5E510"
      blue: "#2472C8"
      magenta: "#BC3FBC"
      cyan: "#11A8CD"
      white: "#E5E5E5"

    bright:
      black: "#666666"
      red: "#F14C4C"
      green: "#23D18B"
      yellow: "#F5F543"
      blue: "#3B8EEA"
      magenta: "#D670D6"
      cyan: "#29B8DB"
      white: "#E5E5E5"

colors: *dark
